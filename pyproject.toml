[project]
name = "algorithms"
version = "0.1.0"
description = "The algorithms behind the articles on chekh.dev: plain Python, tested, traced and timed"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
